[package]
name = "silvercity-oss"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Convert Markdown (with LaTeX math and Mermaid/Dolphin graphs) into high-fidelity Word .docx files"
license = "MIT"
readme = "README.md"
keywords = ["markdown", "docx", "word", "latex", "mermaid"]
categories = ["text-processing", "command-line-utilities"]
exclude = [".github/", ".gitattributes", "tests/data/"]

[lib]
name = "silvercity_oss"
path = "src/lib.rs"

[[bin]]
name = "md2docx"
path = "src/main.rs"
required-features = ["cli"]

[features]
# The `md2docx` command-line tool. Library users should depend on this crate with
# `default-features = false` to avoid compiling clap and shlex.
default = ["cli"]
cli = ["dep:clap", "dep:shlex"]

[dependencies]
# docx-rs's default `image` feature adds TIFF/BMP codecs we never use (we decode images ourselves).
docx-rs = { version = "0.4.22", default-features = false }
pulldown-cmark = { version = "0.13.5", default-features = false }
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
clap = { version = "4", features = ["derive"], optional = true }
percent-encoding = "2.3.2"
shlex = { version = "2", optional = true }
# The same zip docx-rs uses; `deflate` lets us compress the finished archive.
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
quick-xml = "0.41"

[target."cfg(unix)".dependencies]
rustix = { version = "1", features = ["process"] }

# The test suite compresses tens of megabytes of XML; deflate is painfully slow unoptimised.
# (Profiles only affect this repository's own builds, never a crate that depends on this one.)
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.zlib-rs]
opt-level = 3
