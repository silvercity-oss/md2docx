[package]
name = "md2docx"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["silvercity-oss contributors"]
repository = "https://github.com/silvercity-oss/md2docx"
homepage = "https://github.com/silvercity-oss/md2docx"
description = "Convert Markdown (with LaTeX math and Mermaid/Dolphin graphs) into high-fidelity Word .docx files"
license = "MIT"
readme = "README.md"
keywords = ["markdown", "docx", "word", "latex", "mermaid"]
categories = ["text-processing", "command-line-utilities"]
exclude = [".github/", "fuzz/", "tools/", "deny.toml", "RELEASING.md", ".gitattributes", ".cargo/", "tests/data/", "Dockerfile", ".dockerignore"]

[lib]
name = "md2docx"
path = "src/lib.rs"

[[bin]]
name = "md2docx-cli"
path = "src/main.rs"
required-features = ["cli"]

[features]
# The `md2docx-cli` command-line tool. Library users should depend on this crate with
# `default-features = false` to avoid compiling clap, its completion and man-page generators, and shlex.
default = ["cli"]
cli = ["dep:clap", "dep:clap_complete", "dep:clap_mangen", "dep:shlex"]
# Mermaid diagrams rendered *inside the process* by `merman` (a pure-Rust Mermaid): no child
# process, no browser, no JavaScript, nothing written to disk. Needs Rust 1.95 (merman's MSRV);
# the rest of the crate still builds with 1.88. The tested merman version is pinned exactly.
mermaid = ["dep:merman"]
# Every diagram family merman has, not just the common ones `mermaid` enables.
mermaid-all-diagrams = ["mermaid", "merman/all-diagrams"]

# Unstable hooks for this repository's own tests and fuzz targets (`md2docx::__internals`).
# No stability promise: do not enable it.
internals = []

# docs.rs builds with the in-process Mermaid renderer so its API is documented.
[package.metadata.docs.rs]
features = ["mermaid"]

[dependencies]
smallvec = "1.15"
quick-xml = { version = "0.41", default-features = false }
pulldown-cmark = { version = "0.13.5", default-features = false }
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
clap = { version = "4", features = ["derive", "env"], optional = true }
clap_complete = { version = "4", optional = true }
clap_mangen = { version = "0.2", optional = true }
percent-encoding = "2.3.2"
shlex = { version = "2", optional = true }
# Reads and writes the .docx archive (also used by the vendored writer in src/docx).
zip = { version = "9", default-features = false, features = ["deflate"] }

[dependencies.merman]
version = "0.9.2"
optional = true
default-features = false
# PNG export and the common diagram families only: no ELK (EPL-2.0), no math labels, no system
# font queries, no analysis/editor/ASCII/PDF/JPEG code.
features = [
    "png",
    "diagram-flowchart",
    "diagram-sequence",
    "diagram-class",
    "diagram-state",
    "diagram-er",
    "diagram-pie",
    "diagram-gantt",
    "diagram-journey",
    "diagram-mindmap",
    "diagram-timeline",
    "diagram-git-graph",
]

[dev-dependencies]
# Turns on `internals` for the integration tests (the feature is unified into the one library build).
md2docx = { path = ".", features = ["internals"] }

[target."cfg(unix)".dependencies]
rustix = { version = "1", features = ["process"] }

# Windows: a tool and everything it starts live in a Job Object that dies with the guard
# (the Unix equivalent is the process group). A safe wrapper, so this crate stays `forbid(unsafe_code)`.
[target."cfg(windows)".dependencies]
win32job = "2"

# The test suite compresses tens of megabytes of XML; deflate is painfully slow unoptimised.
# (Profiles only affect this repository's own builds, never a crate that depends on this one.)
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.zlib-rs]
opt-level = 3
# Diagram layout and rasterising are the same story when the `mermaid` feature is on.
[profile.dev.package.merman-render]
opt-level = 3
[profile.dev.package.merman-export]
opt-level = 3
[profile.dev.package.resvg]
opt-level = 3
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.usvg]
opt-level = 3
