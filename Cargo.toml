[package]
name = "reqmech_companion"
version = "0.1.0"
edition = "2021"
description = "Convert Markdown (with LaTeX math and Mermaid/Dolphin graphs) into high-fidelity Word .docx files"
license = "MIT"
readme = "README.md"

[lib]
name = "reqmech_companion"
path = "src/lib.rs"

[[bin]]
name = "md2docx"
path = "src/main.rs"

[dependencies]
docx-rs = "0.4.22"
pulldown-cmark = { version = "0.13.5", default-features = false }
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
clap = { version = "4", features = ["derive"] }
percent-encoding = "2.3.2"
shlex = "2.0.1"

[dev-dependencies]
quick-xml = "0.41"
zip = { version = "8", default-features = false, features = ["deflate"] }
