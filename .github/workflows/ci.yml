name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --all-targets --locked

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Integration tests use stand-in renderers, so no mmdc/latex/dvipng is needed.
      # Tests that rely on POSIX shell scripts as mock tools are Unix-only;
      # everything else (OMML, CLI, Markdown mapping, errors) runs on all three.
      - name: Test
        run: cargo test --all-targets --locked
