name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Weekly: re-run the merman confinement tests against the *latest* merman-cli,
  # so a release that starts fetching files or URLs is noticed (see `merman-latest`).
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The CommonMark corpus is in the repo (not the published crate): never skip it in CI.
  REQUIRE_SPEC_CORPUS: "1"

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check
        run: cargo check --all-targets --locked

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Real TeX on Linux so the tests that exercise the TeX hardening against an
      # actual `latex` run (and fail, rather than skip, if the install breaks).
      - name: Install TeX (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended dvipng

      # A real word processor for the open / save / reopen round trip of the fixtures (Math keeps the
      # equations as equations when LibreOffice saves).
      - name: Install LibreOffice (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-math

      # Most integration tests use stand-in renderers, so no mmdc is needed.
      # Tests that rely on POSIX shell scripts or a real TeX are Unix-only and
      # skip elsewhere; everything else (OMML, CLI, Markdown coverage, security
      # gates, fuzz-style tests) runs on all three platforms.
      - name: Test
        run: cargo test --all-targets --locked --no-fail-fast
        env:
          REQUIRE_TEX: ${{ runner.os == 'Linux' && '1' || '' }}
          REQUIRE_SOFFICE: ${{ runner.os == 'Linux' && '1' || '' }}

      # `--all-targets` skips doctests; run them on every platform too.
      - name: Doctests
        run: cargo test --doc --locked

      # Library users build without the CLI feature (no clap/shlex).
      - name: Test as a library (no default features)
        if: runner.os == 'Linux'
        run: cargo test --no-default-features --locked

  # Known vulnerabilities in the dependency tree (RustSec advisory database).
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  # Oldest toolchain we promise to support (Cargo.toml `rust-version`; set by our dependencies).
  # The optional `mermaid` feature needs a newer one (merman's own MSRV): see the `mermaid` job.
  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo check --all-targets --locked
      - run: cargo check --no-default-features --locked

  # The in-process Mermaid renderer (`mermaid` feature; Cargo.lock pins the merman that is tested). It needs Rust 1.95,
  # so the minimum is tested explicitly; stable is tested on Windows too (no process is spawned,
  # which is the point of the feature).
  mermaid:
    name: in-process Mermaid (${{ matrix.toolchain }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, toolchain: "1.95.0" }
          - { os: ubuntu-latest, toolchain: stable }
          - { os: windows-latest, toolchain: stable }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy --no-default-features --features mermaid --all-targets --locked -- -D warnings
      - run: cargo test --features mermaid --locked --no-fail-fast
      - run: cargo test --doc --features mermaid --locked

  # The container recipe in docs/containers.md really works: build the image, then convert
  # through the hostile-input settings with no network, a read-only filesystem and no mounts.
  container:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -t silvercity-oss/md2docx:local .
      - name: Convert on standard input, hostile-input settings
        run: |
          set -e
          printf '# Hello\n\n```mermaid\ngraph TD; A-->B\n```\n\n[x](relative.md)\n' > in.md
          docker run --rm -i --init --network none --read-only --tmpfs /scratch:rw,size=64m \
            --memory 512m --pids-limit 64 --cap-drop ALL --security-opt no-new-privileges \
            -e MD2DOCX_UNTRUSTED=1 -e MD2DOCX_FORMAT=json -e MD2DOCX_SCRATCH_DIR=/scratch \
            silvercity-oss/md2docx:local - --diagrams < in.md > out.docx 2> report.json
          head -c 2 out.docx | grep -q PK
          cat report.json
          grep -q '"status":"ok"' report.json
          unzip -l out.docx | grep -q 'word/media/'
      - name: Strict refusal is status 5 and writes nothing
        run: |
          set +e
          docker run --rm -i --network none --read-only -e MD2DOCX_UNTRUSTED=1 silvercity-oss/md2docx:local - --strict < in.md > strict.docx 2> strict.txt
          status=$?
          set -e
          cat strict.txt
          test "$status" = 5
          test ! -s strict.docx

  # What `cargo publish` would upload must build on its own, and the docs must be warning-free.
  package:
    name: package + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo package --locked
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # Word is stricter than LibreOffice, so the output is also validated against the Office Open XML
  # schemas with Microsoft's Open XML SDK (tools/ooxml-validate): the fixtures, and this
  # repository's own Markdown converted with a spread of options.
  ooxml:
    name: OOXML schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - run: tools/validate-output.sh

  # Licences and sources of every dependency, duplicate versions and advisories (deny.toml).
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo install cargo-deny --locked
      - run: cargo deny --all-features check

  # The public API must stay source compatible with the latest release (RELEASING.md). Until the
  # first tag exists there is nothing to compare against, and the job says so.
  semver:
    name: API compatibility (cargo-semver-checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Compare with the latest tag
        run: |
          tag="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)"
          if [ -z "$tag" ]; then echo "::notice::no release tag yet; nothing to compare the API with"; exit 0; fi
          cargo install cargo-semver-checks --locked
          cargo semver-checks --baseline-rev "$tag"

  # Coverage-guided fuzzing (fuzz/). Thirty seconds per target on every push is a smoke test; the
  # weekly run is ten minutes each. A crash uploads its input as an artifact.
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [markdown_to_docx, latex_to_omml, analyze_html]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=${{ github.event_name == 'schedule' && 600 || 30 }} -rss_limit_mb=2048
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}

  # The default Mermaid engine, against the real renderer. Separate job because
  # building merman-cli takes minutes; the binary is cached by version.
  merman:
    name: merman-cli (real renderer)
    runs-on: ubuntu-latest
    env:
      MERMAN_CLI_VERSION: "0.9.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Cache merman-cli
        id: merman-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/merman-cli
          key: merman-cli-${{ env.MERMAN_CLI_VERSION }}-${{ runner.os }}
      - name: Install merman-cli
        if: steps.merman-cache.outputs.cache-hit != 'true'
        run: cargo install merman-cli --version "$MERMAN_CLI_VERSION" --locked
      - name: Test against the real renderer
        run: cargo test --test merman_real --test merman_hardened --locked
        env:
          REQUIRE_MERMAN: "1"

  # Not a gate on pushes: the newest merman-cli, weekly (or on demand). The
  # hardened diagram mode relies on merman never loading local files or URLs,
  # which is a property of a particular release, so check each new one.
  merman-latest:
    name: merman-cli (latest release, weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install the latest merman-cli
        run: cargo install merman-cli --locked
      - name: Show the version under test
        run: merman-cli --version
      - name: Confinement and rendering tests
        run: cargo test --test merman_real --test merman_hardened --locked
        env:
          REQUIRE_MERMAN: "1"
