name: Release

# Runs when a version tag is pushed. Publishing waits for a human to approve the `crates-io`
# environment (Settings > Environments), so a stray tag cannot publish by itself.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Tag, Cargo.toml and CHANGELOG agree
        id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "$version" = "$cargo_version" || { echo "tag $version != Cargo.toml $cargo_version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: The tagged commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --locked --no-fail-fast
      - run: cargo package --locked

  binaries:
    name: binary (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, exe: md2docx-cli }
          - { os: macos-latest, target: aarch64-apple-darwin, exe: md2docx-cli }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: md2docx-cli.exe }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build (with the in-process Mermaid renderer)
        run: cargo build --release --locked --features mermaid --bin md2docx-cli
      - name: Stage
        shell: bash
        run: |
          name="md2docx-cli-${{ needs.verify.outputs.version }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/release/${{ matrix.exe }}" LICENSE THIRD_PARTY.md README.md "$name/"
          if [ "${{ runner.os }}" = Windows ]; then 7z a "$name.zip" "$name" >/dev/null; echo "asset=$name.zip" >> "$GITHUB_ENV"
          else tar czf "$name.tar.gz" "$name"; echo "asset=$name.tar.gz" >> "$GITHUB_ENV"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: ${{ env.asset }}
          if-no-files-found: error

  publish:
    name: publish to crates.io
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          cd dist && sha256sum * > SHA256SUMS && cd ..
          # The release notes are this version's changelog section.
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          flags=""; case "$VERSION" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "md2docx $VERSION" --notes-file notes.md $flags
