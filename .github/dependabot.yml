version: 2
updates:
  # Workflow actions are pinned to commit SHAs; this proposes the bumps (and security fixes).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      cargo:
        update-types: [minor, patch]
    # `merman` is bumped by hand: its output and its confinement are tested per version.
    ignore:
      - dependency-name: merman
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
